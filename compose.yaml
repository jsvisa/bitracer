services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bitracer
      POSTGRES_PASSWORD: bitracer
      POSTGRES_DB: bitracer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitracer -d bitracer"]
      interval: 5s
      timeout: 3s
      retries: 20

  bitracer:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://bitracer:bitracer@postgres:5432/bitracer?sslmode=disable
      BTC_RPC_URL: ${BTC_RPC_URL}
      BLOCKSEC_LABEL_URL: ${BLOCKSEC_LABEL_URL:-}
      BLOCKSEC_LABEL_APIKEY: ${BLOCKSEC_LABEL_APIKEY:-}
      BLOCKSEC_LABEL_CHAIN_ID: ${BLOCKSEC_LABEL_CHAIN_ID:--1}
    command:
      - run
      - --start-block
      - "970600"
      - --minimum-btc
      - "0.1"
    restart: unless-stopped

volumes:
  pgdata:
